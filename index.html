<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Are Moving!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Fancy gradient background */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow: hidden;
        }

        /* Main Content Card */
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            /* Smooth entrance animation */
            animation: slideUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        /* Floating Icon */
        .icon {
            font-size: 80px;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            /* Text shadow for a bit of depth */
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-weight: 700;
            color: #2d3748;
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        p {
            font-weight: 300;
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Fancy Animated Loading Bar */
        .loader-container {
            width: 100%;
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .loader-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            border-radius: 10px;
            animation: load 2s ease-in-out infinite;
        }

        .footer {
            font-size: 0.85rem;
            color: #a0aec0;
            font-weight: 500;
        }

        /* --- Animations --- */
        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes load {
            0% { width: 0%; transform: translateX(-100%); }
            50% { width: 100%; transform: translateX(0); }
            100% { width: 100%; transform: translateX(100%); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">📦</div>
        
        <h1>We're moving!</h1>
        <p>Pardon the digital dust. We are currently migrating our site to a new server to serve you better. We'll be back up and running very soon.</p>
        
        <div class="loader-container">
            <div class="loader-bar"></div>
        </div>
        
        <div class="footer">Thank you for your patience.</div>
    </div>

</body>
</html>
